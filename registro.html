<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda Web</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Mi Tienda Web</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="banner">
            <article>
                <h2>¡Únete a nuestra tienda!</h2>
                <p>Crea tu cuenta para disfrutar de grandes ofertas y promociones exclusivas.</p>
            </article>
        </section>

        <section class="formulario-container">
            <h2>Formulario de Registro</h2>
            <form id="form-registro" novalidate>
                
                <div class="input-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ej: Juan Pérez" required>
                    <span class="error-msg" id="error-nombre"></span>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="correo@ejemplo.com" required>
                    <span class="error-msg" id="error-email"></span>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required>
                    <span class="error-msg" id="error-password"></span>
                </div>

                <button type="submit" id="btn-enviar">Registrarse</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi Tienda Web. Todos los derechos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
